# НЕПОЛНАЯ спецификация: описывает 4 пути из ~117 маршрутов core-api, и даже
# они местами расходятся с кодом (например, register отвечает 201, а не 202).
# Источник истины - код маршрутов в services/core-api/internal/modules/*.
# См. docs/api/overview.md.
openapi: 3.1.0
info:
  title: RuCord Core API
  version: 0.1.0
servers:
  - url: https://api.example.test
paths:
  /healthz:
    get:
      summary: Core API health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      responses:
        "202":
          description: Registration request accepted for future implementation
  /api/v1/workspaces:
    get:
      summary: List workspaces visible to the authenticated user
      operationId: listWorkspaces
      responses:
        "200":
          description: Workspace list
  /api/v1/channels/{channelId}/messages:
    get:
      summary: List channel messages
      operationId: listMessages
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message page
