# Минорные и патч-обновления приходят одним PR на экосистему раз в неделю.
# Мажорные версии npm, cargo и Go-модулей Dependabot не предлагает: они ломают
# сборку (TypeScript, vitest, windows-core, webview2-com) и обновляются вручную
# отдельным PR с проверкой совместимости. Для GitHub Actions мажоры разрешены.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directories:
      - /libs/shared-go
      - /services/core-api
      - /services/realtime
      - /services/sfu
      - /services/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
