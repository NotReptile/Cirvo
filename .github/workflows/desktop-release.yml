# Release-сборка desktop-клиента на тег v*.
#
# По умолчанию собирается только Windows (.msi + NSIS .exe): это основная
# платформа пользователей, а в приватном репозитории минуты macOS тарифицируются
# с множителем x10. macOS и Linux включаются вручную: Actions → desktop-release →
# Run workflow → platforms = all.
#
# Результат — draft-релиз в GitHub Releases. Проверяешь артефакты руками и
# публикуешь сам. tauri-action дополнительно генерирует подписанный latest.json
# для auto-update (доступен клиентам только после Publish и только если
# репозиторий публичный — подробности в docs/runbooks/desktop-release.md).
#
# Требуемые Secrets:
#   TAURI_SIGNING_PRIVATE_KEY          — приватный ключ updater-подписи
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — его пароль (пустая строка, если без)
#
# Code-signing бинарей (Authenticode / macOS notarization) не настроен:
# SmartScreen и Gatekeeper будут ругаться на «неизвестного издателя».

name: desktop-release

on:
  push:
    # Теги с суффиксом (v0.1.1-test) автоматически не собираются: их запускают
    # вручную через workflow_dispatch, иначе push тега и ручной запуск
    # дублировали бы сборку.
    tags: ["v*", "!v*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег релиза (например v0.1.1-test). Пусто — выбранный тег"
        required: false
        type: string
      platforms:
        description: "Какие платформы собирать"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - all
      prerelease:
        description: "Пометить релиз как pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Без этой проверки пустое поле tag при выбранной ветке давало неочевидную
      # ошибку checkout на refs/tags/<имя ветки>.
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Нужен существующий тег вида v0.1.1 (получено: '$RELEASE_TAG'). При ручном запуске заполни поле tag или выбери тег."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent \
            || { echo "::error::Тег $RELEASE_TAG не найден в репозитории"; exit 1; }

      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          win='{"platform":"windows-latest","args":""}'
          mac='{"platform":"macos-latest","args":"--target universal-apple-darwin"}'
          lin='{"platform":"ubuntu-22.04","args":""}'
          if [ "$PLATFORMS" = "all" ]; then
            echo "matrix={\"include\":[$win,$mac,$lin]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$win]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      # Версия приложения живёт в трёх файлах и должна совпадать с тегом,
      # иначе updater сравнивает версии неправильно. Суффикс после «-»
      # (v0.1.1-test) при сравнении отбрасывается.
      - name: Check version matches tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.RELEASE_TAG.replace(/^v/, "").split("-")[0];
            const pkg = JSON.parse(fs.readFileSync("apps/desktop/package.json", "utf8")).version;
            const tauri = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")).version;
            const cargo = /^version\s*=\s*"([^"]+)"/m.exec(fs.readFileSync("apps/desktop/src-tauri/Cargo.toml", "utf8"))[1];
            const bad = Object.entries({ package: pkg, tauri, cargo }).filter(([, v]) => v !== tag);
            if (bad.length) {
              console.error(`Тег ${process.env.RELEASE_TAG} ожидает версию ${tag}, а в файлах: ${JSON.stringify({ package: pkg, tauri, cargo })}`);
              process.exit(1);
            }
            console.log(`Версия ${tag} совпадает во всех трёх файлах`);
          '

      # npm workspace: lock-файл и node_modules живут в корне репозитория.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: оба таргета нужны для universal-сборки.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Linux: webkit2gtk для Tauri, alsa для cpal, xcb/pipewire для xcap
      # (захват экрана).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "RuCord ${{ env.RELEASE_TAG }}"
          releaseBody: |
            ## Установка (Windows)

            1. Скачать `RuCord_*_x64-setup.exe` из блока **Assets** ниже.
            2. Запустить. Установщик не подписан сертификатом издателя, поэтому SmartScreen
               покажет предупреждение: **Подробнее → Выполнить в любом случае**.
            3. При первом запуске ввести адрес сервера, например `chat.example.com`.

            Список изменений: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
            Артефакты собраны CI из тега `${{ env.RELEASE_TAG }}`.
          # Draft: проверяешь артефакты руками и публикуешь сам.
          releaseDraft: true
          prerelease: ${{ inputs.prerelease || false }}
          args: ${{ matrix.args }}
