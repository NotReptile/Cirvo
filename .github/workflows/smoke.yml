name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rucord
          POSTGRES_USER: rucord
          POSTGRES_PASSWORD: rucord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rucord -d rucord"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # core-api / shared-go ConnectFromEnv hooks
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: rucord
      POSTGRES_USER: rucord
      POSTGRES_PASSWORD: rucord
      POSTGRES_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: rucord
      CIRVO_JWT_SECRET: smoke-secret-with-at-least-32-bytes-of-padding
      CIRVO_ENV: ci
      CIRVO_STAGE: smoke

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          # У нас go workspace — нет общего go.sum в корне; модули каждый со
          # своим go.sum. setup-go по умолчанию включает cache и шумит
          # «Dependencies file is not found». Кэш не критичен для smoke.
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Desktop typecheck, unit tests and build
        run: |
          npm run check:desktop
          npm --workspace apps/desktop test
          npm run build:desktop

      - name: Browser interaction and rendering checks
        run: |
          npm --workspace apps/desktop exec -- playwright install --with-deps chromium
          npm --workspace apps/desktop run test:browser

      # Публичные образы MinIO больше не отдаются анонимно, поэтому собираем из
      # исходников на закреплённом коммите. Коммит один на всех: файл
      # deploy/minio/MINIO_REF читают и этот workflow, и deploy/minio/Dockerfile.
      # Бинарник кэшируется по коммиту: сборка без кэша занимает около 2,5 минут.
      - name: Read pinned MinIO commit
        id: minio_ref
        run: echo "sha=$(tr -d '\r\n' < deploy/minio/MINIO_REF)" >> "$GITHUB_OUTPUT"

      - name: Cache MinIO binary
        id: minio_cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/minio-bin
          key: minio-${{ runner.os }}-${{ steps.minio_ref.outputs.sha }}

      - name: Build MinIO
        if: steps.minio_cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/minio-bin
          GOWORK: 'off'
        run: go install "github.com/minio/minio@${{ steps.minio_ref.outputs.sha }}"

      - name: Start MinIO
        run: |
          mkdir -p "${{ runner.temp }}/minio-data"
          "${{ runner.temp }}/minio-bin/minio" server "${{ runner.temp }}/minio-data" \
            --console-address ":9001" > "${{ runner.temp }}/minio.log" 2>&1 &
      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            curl -sf http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          echo "minio not ready" >&2
          cat "${{ runner.temp }}/minio.log" || true
          exit 1

      - name: Apply migrations
        run: |
          docker run --rm --network=host \
            -v ${{ github.workspace }}/db/migrations:/migrations:ro \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://rucord:rucord@127.0.0.1:5432/rucord?sslmode=disable" \
            up

      - name: Build
        # ./services/... не работает в go workspace: services — это каталог
        # модулей, а не модуль, и `...` расширяется только внутри модуля.
        # Перечисляем модули по очереди.
        run: |
          go build \
            ./services/core-api/... \
            ./services/realtime/... \
            ./services/sfu/... \
            ./services/worker/... \
            ./libs/shared-go/...

      - name: Unit tests with race detector
        run: go test -race ./libs/shared-go/... ./services/core-api/... ./services/realtime/... ./services/sfu/... ./services/worker/...

      - name: Validate production compose
        run: docker compose -f deploy/single-node/docker-compose.yml --env-file deploy/.env.example config --quiet

      - name: Smoke tests
        run: |
          go test -tags=smoke -count=1 -v ./libs/shared-go/wsticket/
          go test -tags=smoke -count=1 -v ./libs/shared-go/channelacl/
          go test -tags=smoke -count=1 -v ./services/realtime/internal/eventjournal/
          go test -tags=smoke -count=1 -v ./services/core-api/smoketests/
          go test -tags=smoke -count=1 -v ./services/realtime/cmd/realtime/ ./services/realtime/internal/modules/transport/ ./services/realtime/internal/modules/signaling/ ./services/worker/internal/jobs/
