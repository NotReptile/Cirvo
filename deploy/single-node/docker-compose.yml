# Single-node deploy.
#
# Поднимает весь стек одной командой: Postgres, Redis, MinIO, Caddy
# reverse-proxy, и Go-сервисы (core-api, realtime, worker) собранные
# из deploy/Dockerfile.service.
#
# Перед запуском:
#   1) cp deploy/.env.example deploy/.env и поправить секреты + CIRVO_DOMAIN
#   2) Миграции БД:
#        docker compose -f deploy/single-node/docker-compose.yml \
#          --env-file deploy/.env run --rm migrate
#   3) Поднять всё:
#        docker compose -f deploy/single-node/docker-compose.yml \
#          --env-file deploy/.env up -d --build
#
# Билд-контекст у Go-сервисов — корень репозитория (../..), потому что
# go.work + libs/shared-go нужны для replace-directives.

x-go-service-env: &go-service-env
  CIRVO_ENV: production
  CIRVO_STAGE: prod
  CIRVO_JWT_SECRET: ${CIRVO_JWT_SECRET:?CIRVO_JWT_SECRET is required}
  CIRVO_JWT_ACCESS_TTL: ${CIRVO_JWT_ACCESS_TTL:-15m}
  CIRVO_CORS_ORIGINS: ${CIRVO_CORS_ORIGINS:-}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-rucord}
  POSTGRES_USER: ${POSTGRES_USER:-rucord}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_BUCKET: ${MINIO_BUCKET:-rucord}
  MINIO_USE_SSL: "false"
  # Пусто = STUN отвечает тот же coturn, что и TURN (адрес берётся из ICE_TURN_URLS).
  ICE_STUN_URLS: ${ICE_STUN_URLS:-}
  ICE_TURN_URLS: ${ICE_TURN_URLS:-turn:${CIRVO_DOMAIN}:3478?transport=udp,turn:${CIRVO_DOMAIN}:3478?transport=tcp}
  ICE_TURN_URL: ${ICE_TURN_URL:-}
  ICE_TURN_USERNAME: ${ICE_TURN_USERNAME:-}
  ICE_TURN_CREDENTIAL: ${ICE_TURN_CREDENTIAL:-}
  ICE_TURN_SHARED_SECRET: ${ICE_TURN_SHARED_SECRET:-}
  # core-api анонсирует SFU клиентам, voice-канал держит до 50 участников.
  # Сервис sfu в этом compose включён всегда (профиля у него нет). Пустое
  # значение не отключает SFU: `:-` подставит адрес по умолчанию. Mesh
  # (до 5 участников) остаётся режимом deploy/local.
  CIRVO_SFU_URL: ${CIRVO_SFU_URL:-wss://${CIRVO_DOMAIN}/sfu/ws}

services:
  reverse-proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CIRVO_DOMAIN: ${CIRVO_DOMAIN:-localhost}
      CIRVO_TLS_EMAIL: ${CIRVO_TLS_EMAIL:-internal}
      CIRVO_CORE_API_HOST: ${CIRVO_CORE_API_HOST:-core-api}
      CIRVO_REALTIME_HOST: ${CIRVO_REALTIME_HOST:-realtime}
      CIRVO_SFU_HOST: ${CIRVO_SFU_HOST:-sfu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      core-api:
        condition: service_started
      realtime:
        condition: service_started
      sfu:
        condition: service_healthy

  core-api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: core-api
    image: rucord-core-api:local
    restart: unless-stopped
    environment:
      <<: *go-service-env
      CIRVO_HTTP_ADDRESS: ":8080"
      # Bootstrap первого админа — применяется один раз при пустой БД.
      CIRVO_BOOTSTRAP_EMAIL: ${CIRVO_BOOTSTRAP_EMAIL:-}
      CIRVO_BOOTSTRAP_USERNAME: ${CIRVO_BOOTSTRAP_USERNAME:-}
      CIRVO_BOOTSTRAP_PASSWORD: ${CIRVO_BOOTSTRAP_PASSWORD:-}
      CIRVO_BOOTSTRAP_DISPLAY_NAME: ${CIRVO_BOOTSTRAP_DISPLAY_NAME:-}
      CIRVO_BOOTSTRAP_WORKSPACE_SLUG: ${CIRVO_BOOTSTRAP_WORKSPACE_SLUG:-}
      CIRVO_BOOTSTRAP_WORKSPACE_NAME: ${CIRVO_BOOTSTRAP_WORKSPACE_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  realtime:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: realtime
    image: rucord-realtime:local
    restart: unless-stopped
    environment:
      <<: *go-service-env
      CIRVO_HTTP_ADDRESS: ":8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: worker
    image: rucord-worker:local
    restart: unless-stopped
    environment:
      <<: *go-service-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # TURN-релей для WebRTC. Без него два клиента за NAT/CGNAT (домашний
  # интернет, мобильный) не могут установить медиа-соединение — сигналинг
  # проходит (видно, что собеседник зашёл в канал), но звук/видео/демонстрация
  # не идут. coturn ретранслирует медиа через себя.
  #
  # Требует проброса на роутере (в дополнение к 80/443):
  #   UDP+TCP 3478              — control/allocation
  #   UDP 49160-49200          — relay-диапазон (хватает на небольшую группу)
  # external-ip резолвится из CIRVO_DOMAIN при старте (duckdns → публичный IP),
  # чтобы relay-кандидаты содержали внешний адрес, а не внутренний docker-IP.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        EXTIP=$$(getent hosts ${CIRVO_DOMAIN:-localhost} | awk '{print $$1}');
        echo "coturn external-ip=$$EXTIP realm=${CIRVO_DOMAIN:-localhost}";
        if [ -n "${ICE_TURN_SHARED_SECRET:-}" ]; then
          AUTH="--use-auth-secret --static-auth-secret=${ICE_TURN_SHARED_SECRET}";
        else
          AUTH="--lt-cred-mech --user=${ICE_TURN_USERNAME:-rucord}:${ICE_TURN_CREDENTIAL:-rucord}";
        fi;
        exec turnserver -n --no-cli --no-tls --no-dtls
        --listening-port=3478
        --min-port=49160 --max-port=49200
        --realm=${CIRVO_DOMAIN:-localhost}
        $$AUTH
        $${EXTIP:+--external-ip=$$EXTIP}
        --log-file=stdout --simple-log

  # SFU — основной production-транспорт голоса/видео/screen share.
  # Mesh остаётся только для локального запуска без CIRVO_SFU_URL.
  # Медиа (RTP) идёт ОДНИМ UDP-портом CIRVO_SFU_UDP_PORT — его нужно
  # пробросить на роутере (UDP), как relay-диапазон coturn. Сигналинг
  # (WebSocket) проходит через Caddy на /sfu/ws, медиа — мимо, напрямую.
  sfu:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: sfu
    image: rucord-sfu:local
    restart: unless-stopped
    environment:
      <<: *go-service-env
      CIRVO_HTTP_ADDRESS: ":8095"
      CIRVO_SFU_UDP_PORT: ${CIRVO_SFU_UDP_PORT:-50000}
      # Публичный IP сервера для NAT 1:1 host-кандидатов. Без него ICE
      # анонсирует только внутренние docker-адреса — медиа не пройдёт
      # из интернета. На чистом LAN можно оставить пустым.
      CIRVO_SFU_PUBLIC_IP: ${CIRVO_SFU_PUBLIC_IP:-}
    ports:
      - "${CIRVO_SFU_UDP_PORT:-50000}:${CIRVO_SFU_UDP_PORT:-50000}/udp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rucord}
      POSTGRES_USER: ${POSTGRES_USER:-rucord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rucord} -d ${POSTGRES_DB:-rucord}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Миграции применяются явно командой:
  #   docker compose -f deploy/single-node/docker-compose.yml \
  #     --env-file deploy/.env run --rm migrate
  # Profile `tools` исключает контейнер из `docker compose up`.
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-rucord}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rucord}?sslmode=disable"
      - "up"
    restart: "no"

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Публичные образы MinIO больше не публикуются: собираем из исходников на
  # закреплённом коммите (deploy/minio/Dockerfile, коммит в MINIO_REF).
  minio:
    build:
      context: ../minio
      target: minio
    image: rucord-minio:local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-off контейнер для backup/restore MinIO бакета через mc mirror.
  # Используется скриптами deploy/backup.sh и deploy/restore.sh.
  # Собирается из того же deploy/minio/Dockerfile (цель mc, коммит в MC_REF).
  mc:
    build:
      context: ../minio
      target: mc
    image: rucord-minio-mc:local
    profiles: ["tools"]
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-rucord}

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  minio-data:
