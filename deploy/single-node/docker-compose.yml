# Single-node deploy.
#
# Поднимает весь стек одной командой: Postgres, Redis, MinIO, Caddy
# reverse-proxy, и Go-сервисы (core-api, realtime, worker) собранные
# из deploy/Dockerfile.service.
#
# Перед запуском:
#   1) cp deploy/.env.example deploy/.env и поправить секреты + RUCORD_DOMAIN
#   2) Миграции БД:
#        docker compose -f deploy/single-node/docker-compose.yml \
#          --env-file deploy/.env run --rm migrate
#   3) Поднять всё:
#        docker compose -f deploy/single-node/docker-compose.yml \
#          --env-file deploy/.env up -d --build
#
# Билд-контекст у Go-сервисов — корень репозитория (../..), потому что
# go.work + libs/shared-go нужны для replace-directives.

x-go-service-env: &go-service-env
  RUCORD_ENV: ${RUCORD_ENV:-production}
  RUCORD_STAGE: ${RUCORD_STAGE:-prod}
  RUCORD_JWT_SECRET: ${RUCORD_JWT_SECRET:?RUCORD_JWT_SECRET is required}
  RUCORD_JWT_ACCESS_TTL: ${RUCORD_JWT_ACCESS_TTL:-15m}
  RUCORD_CORS_ORIGINS: ${RUCORD_CORS_ORIGINS:-}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-rucord}
  POSTGRES_USER: ${POSTGRES_USER:-rucord}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_BUCKET: ${MINIO_BUCKET:-rucord}
  MINIO_USE_SSL: "false"
  ICE_STUN_URLS: ${ICE_STUN_URLS:-stun:stun.l.google.com:19302}
  ICE_TURN_URL: ${ICE_TURN_URL:-}
  ICE_TURN_USERNAME: ${ICE_TURN_USERNAME:-}
  ICE_TURN_CREDENTIAL: ${ICE_TURN_CREDENTIAL:-}
  # F.2: непустой → core-api анонсирует SFU клиентам (mesh-потолок снят),
  # voice-канал держит до 50 участников. Пусто = mesh (до 5). Включается
  # вместе с профилем `sfu` (см. сервис sfu ниже).
  RUCORD_SFU_URL: ${RUCORD_SFU_URL:-}

services:
  reverse-proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      RUCORD_DOMAIN: ${RUCORD_DOMAIN:-localhost}
      RUCORD_TLS_EMAIL: ${RUCORD_TLS_EMAIL:-internal}
      RUCORD_CORE_API_HOST: ${RUCORD_CORE_API_HOST:-core-api}
      RUCORD_REALTIME_HOST: ${RUCORD_REALTIME_HOST:-realtime}
      RUCORD_SFU_HOST: ${RUCORD_SFU_HOST:-sfu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      core-api:
        condition: service_started
      realtime:
        condition: service_started

  core-api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: core-api
    image: rucord-core-api:local
    restart: unless-stopped
    environment:
      <<: *go-service-env
      RUCORD_HTTP_ADDRESS: ":8080"
      # Bootstrap первого админа — применяется один раз при пустой БД.
      RUCORD_BOOTSTRAP_EMAIL: ${RUCORD_BOOTSTRAP_EMAIL:-}
      RUCORD_BOOTSTRAP_USERNAME: ${RUCORD_BOOTSTRAP_USERNAME:-}
      RUCORD_BOOTSTRAP_PASSWORD: ${RUCORD_BOOTSTRAP_PASSWORD:-}
      RUCORD_BOOTSTRAP_DISPLAY_NAME: ${RUCORD_BOOTSTRAP_DISPLAY_NAME:-}
      RUCORD_BOOTSTRAP_WORKSPACE_SLUG: ${RUCORD_BOOTSTRAP_WORKSPACE_SLUG:-}
      RUCORD_BOOTSTRAP_WORKSPACE_NAME: ${RUCORD_BOOTSTRAP_WORKSPACE_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  realtime:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: realtime
    image: rucord-realtime:local
    restart: unless-stopped
    environment:
      <<: *go-service-env
      RUCORD_HTTP_ADDRESS: ":8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: worker
    image: rucord-worker:local
    restart: unless-stopped
    environment:
      <<: *go-service-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # TURN-релей для WebRTC. Без него два клиента за NAT/CGNAT (домашний
  # интернет, мобильный) не могут установить медиа-соединение — сигналинг
  # проходит (видно, что собеседник зашёл в канал), но звук/видео/демонстрация
  # не идут. coturn ретранслирует медиа через себя.
  #
  # Требует проброса на роутере (в дополнение к 80/443):
  #   UDP+TCP 3478              — control/allocation
  #   UDP 49160-49200          — relay-диапазон (хватает на небольшую группу)
  # external-ip резолвится из RUCORD_DOMAIN при старте (duckdns → публичный IP),
  # чтобы relay-кандидаты содержали внешний адрес, а не внутренний docker-IP.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        EXTIP=$$(getent hosts ${RUCORD_DOMAIN:-localhost} | awk '{print $$1}');
        echo "coturn external-ip=$$EXTIP realm=${RUCORD_DOMAIN:-localhost}";
        exec turnserver -n --no-cli --no-tls --no-dtls
        --listening-port=3478
        --min-port=49160 --max-port=49200
        --realm=${RUCORD_DOMAIN:-localhost}
        --lt-cred-mech
        --user=${ICE_TURN_USERNAME:-rucord}:${ICE_TURN_CREDENTIAL:-rucord}
        $${EXTIP:+--external-ip=$$EXTIP}
        --log-file=stdout --simple-log

  # SFU (F.2) — групповой голос >5 участников. По умолчанию ВЫКЛЮЧЕН
  # (профиль `sfu`); без него клиенты работают в mesh (до 5). Включение:
  #   1) в .env: RUCORD_SFU_URL=wss://<RUCORD_DOMAIN>/sfu/ws
  #              RUCORD_SFU_PUBLIC_IP=<публичный IP сервера>
  #   2) поднять с профилем:
  #        docker compose -f deploy/single-node/docker-compose.yml \
  #          --env-file deploy/.env --profile sfu up -d --build
  # Медиа (RTP) идёт ОДНИМ UDP-портом RUCORD_SFU_UDP_PORT — его нужно
  # пробросить на роутере (UDP), как relay-диапазон coturn. Сигналинг
  # (WebSocket) проходит через Caddy на /sfu/ws, медиа — мимо, напрямую.
  sfu:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE_NAME: sfu
    image: rucord-sfu:local
    profiles: ["sfu"]
    restart: unless-stopped
    environment:
      <<: *go-service-env
      RUCORD_HTTP_ADDRESS: ":8095"
      RUCORD_SFU_UDP_PORT: ${RUCORD_SFU_UDP_PORT:-50000}
      # Публичный IP сервера для NAT 1:1 host-кандидатов. Без него ICE
      # анонсирует только внутренние docker-адреса — медиа не пройдёт
      # из интернета. На чистом LAN можно оставить пустым.
      RUCORD_SFU_PUBLIC_IP: ${RUCORD_SFU_PUBLIC_IP:-}
    ports:
      - "${RUCORD_SFU_UDP_PORT:-50000}:${RUCORD_SFU_UDP_PORT:-50000}/udp"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rucord}
      POSTGRES_USER: ${POSTGRES_USER:-rucord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rucord} -d ${POSTGRES_DB:-rucord}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Миграции применяются явно командой:
  #   docker compose -f deploy/single-node/docker-compose.yml \
  #     --env-file deploy/.env run --rm migrate
  # Profile `tools` исключает контейнер из `docker compose up`.
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-rucord}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rucord}?sslmode=disable"
      - "up"
    restart: "no"

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-off контейнер для backup/restore MinIO бакета через mc mirror.
  # Используется скриптами deploy/backup.sh и deploy/restore.sh.
  mc:
    image: minio/mc:latest
    profiles: ["tools"]
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-rucord}

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  minio-data:
