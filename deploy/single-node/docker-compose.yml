# Single-node deploy.
#
# Поднимает инфраструктуру (Postgres, Redis, MinIO) + Caddy reverse-proxy.
# Сервисы core-api / realtime / worker пока запускаются как host-процессы
# (см. `apps/desktop` README); Caddy проксирует их через
# `host.docker.internal`. После того как появятся Dockerfile'ы для сервисов
# (см. roadmap A.5) — добавить их сюда же и поменять RUCORD_UPSTREAM_HOST.
#
# Перед запуском:
#   1) cp deploy/.env.example deploy/.env и поправить секреты + RUCORD_DOMAIN
#   2) docker compose -f deploy/single-node/docker-compose.yml --env-file deploy/.env up -d

services:
  reverse-proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      RUCORD_DOMAIN: ${RUCORD_DOMAIN:-localhost}
      RUCORD_TLS_EMAIL: ${RUCORD_TLS_EMAIL:-internal}
      RUCORD_UPSTREAM_HOST: ${RUCORD_UPSTREAM_HOST:-host.docker.internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      # На Linux Docker по умолчанию не резолвит host.docker.internal —
      # добавляем явный маппинг на host-gateway.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rucord}
      POSTGRES_USER: ${POSTGRES_USER:-rucord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rucord} -d ${POSTGRES_DB:-rucord}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-rucord}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rucord}?sslmode=disable"
      - "up"
    restart: "no"

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  minio-data:
