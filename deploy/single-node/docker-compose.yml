services:
  reverse-proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rucord
      POSTGRES_USER: rucord
      POSTGRES_PASSWORD: change-me

  redis:
    image: redis:7

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me
