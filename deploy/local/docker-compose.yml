services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rucord
      POSTGRES_USER: rucord
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
