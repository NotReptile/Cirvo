services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rucord}
      POSTGRES_USER: ${POSTGRES_USER:-rucord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rucord} -d ${POSTGRES_DB:-rucord}" ]
      interval: 3s
      timeout: 3s
      retries: 20

  # Запускается через `docker compose run --rm migrate` (см. VSCode task
  # `migrate` или `Run All`). Profile `tools` исключает его из `up`, чтобы
  # новые миграции применялись каждый раз, а не один раз на жизнь stack'а.
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-rucord}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-rucord}?sslmode=disable"
      - "up"
    restart: "no"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change-me}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # TURN/STUN-сервер для WebRTC. Запускается под профилем `turn`:
  #   docker compose --profile turn up coturn
  # На локальной 1-к-1 разработке обычно не нужен (хватает host candidates +
  # Google STUN). Поднимай при тестах через NAT/мобильные сети.
  coturn:
    image: coturn/coturn:latest
    profiles: ["turn"]
    network_mode: host
    command: >
      -n
      --no-cli
      --no-tls
      --no-dtls
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --realm=${TURN_REALM:-rucord.local}
      --user=${TURN_USERNAME:-rucord}:${TURN_PASSWORD:-change-me}
      --lt-cred-mech
      --fingerprint
      --log-file=stdout

volumes:
  postgres-data:
  minio-data:
