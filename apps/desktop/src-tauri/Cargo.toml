[package]
name = "cirvo-desktop"
version = "0.3.1"
description = "Cirvo desktop shell"
authors = ["Cirvo"]
edition = "2021"

[lib]
name = "cirvo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

# K.2: глобальные хоткеи. Только desktop — на mobile (iOS/Android) этого
# плагина нет, поэтому target-фильтр.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
# K.5/K.9: enumerate мониторов/окон + захват кадров для собственной screen-share
# pipeline. Подменяет browser-getDisplayMedia → убирает плашку «сайт делает
# демонстрацию вашего экрана» (K.9), и даёт собственный picker (K.5).
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23"
# K.5(c): WASAPI loopback на Windows для захвата системного звука. cpal
# абстрагирует host-API; на Windows строит input-stream из output-device'а
# в loopback-режиме. Mac/Linux пока не покрываем (ScreenCaptureKit и
# PipeWire — отдельные интеграции).
cpal = "0.18"
# F.8: auto-update. Клиент проверяет latest.json на выбранном HTTPS-сервере
# и проверяет подпись установщика; process — для relaunch
# после установки. Только desktop (на mobile — сторы).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

# Убираем нативные плашки WebView2 (разрешение микрофона/камеры, «сохранить
# пароль») — см. webview_tweaks.rs. Версии строго те, что уже в графе у wry
# (Cargo.lock: webview2-com 0.39.x, windows-core 0.62.x) — второе дерево
# `windows` даст несовместимые COM-типы.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
webview2-com = "0.39"
windows-core = "0.62"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
